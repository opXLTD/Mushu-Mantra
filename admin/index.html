<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | BUGINGO Ally Baba</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{--bg:#0f1117;--card:#171a23;--border:#262b38;--text:#eef0f5;--muted:#9aa1b1;--accent:#4f7dff;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);}
  header h1{font-size:18px;margin:0;}
  #logoutBtn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;}
  .tab.active{color:#fff;border-color:var(--accent);background:#1c2333;}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;}
  .stat{font-size:28px;font-weight:700;}
  .stat-label{color:var(--muted);font-size:13px;}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;}
  input[type=text],textarea{width:100%;padding:9px;border-radius:6px;border:1px solid var(--border);background:#0f1117;color:var(--text);font-size:14px;}
  input[type=file]{margin-top:4px;}
  button.primary{margin-top:16px;background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;}
  button.primary:disabled{opacity:.5;cursor:default;}
  #loginScreen{max-width:360px;margin:80px auto;}
  #loginScreen input{margin-bottom:10px;}
  .error{color:#ff6b6b;font-size:13px;margin-top:8px;}
  #flyerPreview{background:#fff;color:#111;border-radius:10px;padding:24px;margin-top:20px;max-width:480px;font-family:Georgia,serif;}
  #flyerPreview h2{margin-top:0;}
  #flyerPreview .badge{display:inline-block;background:#eef2ff;color:#3949ab;padding:3px 10px;border-radius:20px;font-size:11px;font-family:Arial,sans-serif;margin-bottom:10px;}
  #flyerPreview .section{margin:14px 0;font-family:Arial,sans-serif;font-size:14px;}
  #flyerPreview .section h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;color:#555;letter-spacing:.5px;}
  #flyerPreview .cta{display:inline-block;background:#111;color:#fff;padding:10px 18px;border-radius:6px;margin-top:10px;text-decoration:none;font-family:Arial,sans-serif;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <h2>Admin Login</h2>
    <input type="text" id="loginEmail" placeholder="Email">
    <input type="text" id="loginPassword" placeholder="Password" style="-webkit-text-security:disc;">
    <button class="primary" id="loginBtn">Log In</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <header>
    <h1>BUGINGO Ally Baba — Admin</h1>
    <button id="logoutBtn">Log out</button>
  </header>

  <div class="wrap">
    <div class="tabs">
      <div class="tab active" data-tab="traffic">Traffic</div>
      <div class="tab" data-tab="leads">Leads</div>
      <div class="tab" data-tab="poster">AI Poster Generator</div>
    </div>

    <div class="panel active" id="panel-traffic">
      <div class="card">
        <div class="stat" id="totalViews">–</div>
        <div class="stat-label">Total page views</div>
      </div>
      <div class="card">
        <h3>Recent visits</h3>
        <table>
          <thead><tr><th>Page</th><th>Referrer</th><th>When</th></tr></thead>
          <tbody id="viewsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="panel-leads">
      <div class="card">
        <h3>Leads / messages</h3>
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Source</th><th>When</th></tr></thead>
          <tbody id="leadsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="panel-poster">
      <div class="card">
        <h3>Generate an opportunity flyer</h3>
        <label>Opportunity document (image, screenshot, or PDF)</label>
        <input type="file" id="posterFile" accept="image/*,application/pdf">
        <label>Your company name (for branding)</label>
        <input type="text" id="posterCompany" value="BUGINGO Ally Baba — Application Support">
        <label>Your contact (for "need help applying")</label>
        <input type="text" id="posterContact" placeholder="WhatsApp / phone / email">
        <label>Notes for the AI (optional)</label>
        <textarea id="posterNotes" rows="2" placeholder="Anything extra it should know"></textarea>
        <button class="primary" id="generateBtn">Generate Flyer</button>
        <div class="error" id="posterError"></div>
      </div>

      <div id="flyerPreview" style="display:none;"></div>
      <div id="flyerActions" style="display:none;margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="primary" id="downloadBtn">Download as Image</button>
        <button class="primary" id="publishBtn" style="background:#2fae63;">Publish to Website</button>
      </div>
      <div class="error" id="publishStatus" style="color:#7ee2a8;"></div>

      <div class="card" style="margin-top:24px;">
        <h3>Published opportunities</h3>
        <table>
          <thead><tr><th>Title</th><th>Provider</th><th>Deadline</th><th>Status</th><th></th></tr></thead>
          <tbody id="publishedTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ====== CONFIGURE THESE ======
const SUPABASE_URL = "https://mfnndtyhmlofqegzdbrw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mbm5kdHlobWxvZnFlZ3pkYnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDAxNzIsImV4cCI6MjEwNTk3NjE3Mn0.wj9YWt67wDVp5cl6tIBlvywz7nshCSBg9cJUGp--cBA";
const NOTIFY_SECRET = "d84de3063d0b0656d80b080bd0b5ade0"; // must match the NOTIFY_SECRET env var on Vercel
// ==============================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let session = null;

async function checkSession() {
  const { data } = await supabase.auth.getSession();
  session = data.session;
  if (session) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadTraffic();
    loadLeads();
  } else {
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }
}

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  document.getElementById('loginError').textContent = error ? error.message : '';
  if (!error) checkSession();
};

document.getElementById('logoutBtn').onclick = async () => {
  await supabase.auth.signOut();
  checkSession();
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  };
});

async function loadTraffic() {
  const { count } = await supabase.from('page_views').select('*', { count: 'exact', head: true });
  document.getElementById('totalViews').textContent = count ?? '0';

  const { data } = await supabase.from('page_views').select('*').order('created_at', { ascending: false }).limit(20);
  document.getElementById('viewsTable').innerHTML = (data || []).map(v =>
    `<tr><td>${v.page}</td><td>${v.referrer || '–'}</td><td>${new Date(v.created_at).toLocaleString()}</td></tr>`
  ).join('');
}

async function loadLeads() {
  const { data } = await supabase.from('leads').select('*').order('created_at', { ascending: false }).limit(50);
  document.getElementById('leadsTable').innerHTML = (data || []).map(l =>
    `<tr><td>${l.name || '–'}</td><td>${l.email || '–'}</td><td>${l.phone || '–'}</td><td>${l.message || '–'}</td><td>${l.source || '–'}</td><td>${new Date(l.created_at).toLocaleString()}</td></tr>`
  ).join('');
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('generateBtn').onclick = async () => {
  const fileInput = document.getElementById('posterFile');
  const errEl = document.getElementById('posterError');
  errEl.textContent = '';
  if (!fileInput.files[0]) { errEl.textContent = 'Please choose a file first.'; return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = 'Generating…';

  try {
    const file = fileInput.files[0];
    const base64 = await fileToBase64(file);
    const res = await fetch('/api/generate-flyer', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + session.access_token,
      },
      body: JSON.stringify({
        fileBase64: base64,
        mediaType: file.type,
        companyName: document.getElementById('posterCompany').value,
        companyContact: document.getElementById('posterContact').value,
        notes: document.getElementById('posterNotes').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to generate');
    currentFlyerId = data.id || null;
    document.getElementById('publishStatus').textContent = '';
    renderFlyer(data.flyer);
    document.getElementById('flyerActions').style.display = 'flex';
    loadPublished();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Generate Flyer';
  }
};

let currentFlyerId = null;
let currentFlyer = null;

function renderFlyer(f) {
  currentFlyer = f;
  const el = document.getElementById('flyerPreview');
  el.innerHTML = `
    <span class="badge">${f.opportunityType || 'Opportunity'}</span>
    <h2>${f.title || ''}</h2>
    <p><strong>${f.provider || ''}</strong>${f.location ? ' — ' + f.location : ''}</p>
    <div class="section"><h4>What is it?</h4><p>${f.whatIsIt || ''}</p></div>
    <div class="section"><h4>Who is it for?</h4><p>${f.whoIsItFor || ''}</p></div>
    <div class="section"><h4>What it offers</h4><p>${(f.offers||[]).join(', ')}</p></div>
    <div class="section"><h4>Eligibility</h4><p>${(f.eligibility||[]).join(', ')}</p></div>
    <div class="section"><h4>Deadline</h4><p>${f.deadline || ''}</p></div>
    <div class="section"><h4>Official application</h4><p>${f.officialApplication?.method || ''} ${f.officialApplication?.link || ''} ${f.officialApplication?.contact || ''}</p></div>
    <div class="section"><h4>Need help applying?</h4><p>${f.needHelp?.companyName || ''} — ${f.needHelp?.contact || ''}</p></div>
    <a class="cta" href="#">${f.callToAction || 'Apply Now'}</a>
  `;
  el.style.display = 'block';
  document.getElementById('downloadBtn').style.display = 'inline-block';
}

document.getElementById('downloadBtn').onclick = () => {
  html2canvas(document.getElementById('flyerPreview')).then(canvas => {
    const link = document.createElement('a');
    link.download = 'flyer.png';
    link.href = canvas.toDataURL();
    link.click();
  });
};

document.getElementById('publishBtn').onclick = async () => {
  const statusEl = document.getElementById('publishStatus');
  if (!currentFlyerId) {
    statusEl.style.color = '#ff6b6b';
    statusEl.textContent = "This flyer wasn't saved, so it can't be published. Try generating it again.";
    return;
  }
  const { error } = await supabase
    .from('poster_requests')
    .update({ published: true, published_at: new Date().toISOString() })
    .eq('id', currentFlyerId);

  if (error) {
    statusEl.style.color = '#ff6b6b';
    statusEl.textContent = 'Failed to publish: ' + error.message;
  } else {
    statusEl.style.color = '#7ee2a8';
    statusEl.textContent = '✓ Published — now live on /opportunities';
    loadPublished();
    fetch('/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Notify-Secret': NOTIFY_SECRET },
      body: JSON.stringify({
        type: 'opportunity',
        title: currentFlyer?.title || 'New opportunity',
        description: currentFlyer?.whatIsIt || '',
        link: location.origin + '/opportunities/index.html',
        extra: currentFlyer?.deadline ? ('Deadline: ' + currentFlyer.deadline) : '',
      }),
    }).catch(function(){ /* fail silently */ });
  }
};

async function loadPublished() {
  const { data } = await supabase
    .from('poster_requests')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(30);

  document.getElementById('publishedTable').innerHTML = (data || []).map(p => {
    const f = p.generated_flyer || {};
    return `<tr>
      <td>${p.opportunity_title || '–'}</td>
      <td>${f.provider || '–'}</td>
      <td>${f.deadline || '–'}</td>
      <td>${p.published ? '🟢 Published' : '⚪ Draft'}</td>
      <td><button class="primary" style="padding:4px 10px;font-size:12px;${p.published ? 'background:#8a1f2d;' : ''}"
            onclick="togglePublish('${p.id}', ${!p.published})">${p.published ? 'Unpublish' : 'Publish'}</button></td>
    </tr>`;
  }).join('');
}

window.togglePublish = async (id, makePublished) => {
  const { data: row } = await supabase.from('poster_requests').select('*').eq('id', id).single();
  await supabase.from('poster_requests').update({
    published: makePublished,
    published_at: makePublished ? new Date().toISOString() : null,
  }).eq('id', id);
  if (makePublished && row) {
    const f = row.generated_flyer || {};
    fetch('/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Notify-Secret': NOTIFY_SECRET },
      body: JSON.stringify({
        type: 'opportunity',
        title: f.title || row.opportunity_title || 'New opportunity',
        description: f.whatIsIt || '',
        link: location.origin + '/opportunities/index.html',
        extra: f.deadline ? ('Deadline: ' + f.deadline) : '',
      }),
    }).catch(function(){});
  }
  loadPublished();
};

checkSession();
document.querySelector('[data-tab="poster"]').addEventListener('click', loadPublished);
</script>
</body>
</html>
